<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đặt lại mật khẩu · SEMS</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="auth-brand" href="/"><span class="brand-mark">S</span> SEMS</a>
        <span class="intro-kicker">SMART EVENT MANAGEMENT</span>
        <h1>Đặt mật khẩu mới cho tài khoản.</h1>
        <p>Liên kết chỉ dùng được một lần và hết hạn sau 20 phút.</p>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-card-brand">
            <span class="brand-mark">S</span>
            <span>SEMS<small>HỆ THỐNG QUẢN LÝ SỰ KIỆN</small></span>
          </div>
          <h2>Đặt lại mật khẩu</h2>
          <div id="auth-message" class="auth-message" role="status" hidden></div>
          <form id="reset-form">
            <label for="new-password">Mật khẩu mới</label>
            <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
            <label for="confirm-password">Nhập lại mật khẩu</label>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
            <button class="btn auth-submit" type="submit">Lưu mật khẩu mới</button>
          </form>
          <p class="auth-switch"><a href="/login.html">Quay lại đăng nhập</a></p>
        </div>
      </section>
    </main>
    <script type="module" src="/js/recovery.js"></script>
  </body>
</html>
