<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quên mật khẩu · SEMS</title>
    <link rel="stylesheet" href="/css/theme.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="auth-brand" href="/"><span class="brand-mark">S</span> SEMS</a>
        <span class="intro-kicker">SMART EVENT MANAGEMENT</span>
        <h1>Khôi phục quyền truy cập tài khoản.</h1>
        <p>Nhận liên kết đặt lại mật khẩu qua email đã xác minh.</p>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-card-brand">
            <span class="brand-mark">S</span>
            <span>SEMS<small>HỆ THỐNG QUẢN LÝ SỰ KIỆN</small></span>
          </div>
          <h2>Quên mật khẩu</h2>
          <p class="muted">Nhập email tài khoản của bạn. Liên kết có hiệu lực 20 phút.</p>
          <div id="auth-message" class="auth-message" role="status" hidden></div>
          <form id="forgot-form">
            <label for="email">Email tài khoản</label>
            <input id="email" type="email" autocomplete="email" maxlength="190" required />
            <button class="btn auth-submit" type="submit">Gửi liên kết</button>
          </form>
          <p class="auth-switch"><a href="/login.html">Quay lại đăng nhập</a></p>
        </div>
      </section>
    </main>
    <script type="module" src="/js/recovery.js"></script>
  </body>
</html>
