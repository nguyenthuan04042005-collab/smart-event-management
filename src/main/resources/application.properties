spring.application.name=smart-event-management
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_event_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
app.jwt-secret=${JWT_SECRET:LOCAL_DEMO_JWT_SECRET_CHANGE_BEFORE_SHARING_2026_32_CHARS}
app.jwt-hours=${JWT_HOURS:8}
app.ticket-secret=${TICKET_SECRET:LOCAL_DEMO_CHANGE_THIS_SECRET_BEFORE_SHARING_2026}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.banner-upload-dir=${BANNER_UPLOAD_DIR:uploads/banners}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
